name: Publish MGL Zen APK

on:
  push:
    paths:
      - .github/workflows/publish-mgl-zen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated APK artifact
        run: |
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-dee8-822f-beaf-27e4083096d3/raw?se=2026-09-17T06%3A46%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=01a0ae18-80f9-7391-8d1f-682d71d4eaf7&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A25%3A15Z&ske=2026-09-18T02%3A25%3A15Z&sks=b&skv=2026-02-06&sig=UI7AfFGkC7e1Ib4EP/8UPDwPqPrXUN2HFdEZNQpFF08%3D' -o /tmp/mgl-zen.zip
          unzip -p /tmp/mgl-zen.zip app-debug.apk > MGL-Zen-demo.apk
          test -s MGL-Zen-demo.apk
      - name: Publish direct APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MGL-Zen-demo.apk
          git commit -m "Publish MGL Zen Android demo"
          git push
