name: Publish MGL Zen 0.5.0

on:
  push:
    paths:
      - .github/workflows/publish-mgl-zen-050.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated APK
        run: |
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-ea70-822f-a319-026e3695d2e8/raw?se=2026-09-17T13%3A48%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=01a0af95-92fa-7c3f-a6e1-0b5fad41ce30&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T13%3A04%3A49Z&ske=2026-09-18T13%3A04%3A49Z&sks=b&skv=2026-02-06&sig=Zis33Ctx/Wh%2BXbWvk0aBNQNa3IyksJ3elhh4CpAU/0A%3D' -o /tmp/mgl-zen.zip
          unzip -p /tmp/mgl-zen.zip app-debug.apk > MGL-Zen-demo-v0.5.0.apk
          test -s MGL-Zen-demo-v0.5.0.apk
      - name: Publish demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MGL-Zen-demo-v0.5.0.apk
          git commit -m "Publish MGL Zen 0.5.0 interaction polish"
          git push
