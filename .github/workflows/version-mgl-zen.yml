name: Version MGL Zen APK

on:
  push:
    paths:
      - .github/workflows/version-mgl-zen.yml

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish cache-safe APK name
        run: |
          cp MGL-Zen-demo.apk MGL-Zen-demo-v0.3.0.apk
          test -s MGL-Zen-demo-v0.3.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MGL-Zen-demo-v0.3.0.apk
          git commit -m "Publish cache-safe MGL Zen 0.3.0 APK"
          git push
