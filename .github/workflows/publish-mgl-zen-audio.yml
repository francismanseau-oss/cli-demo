name: Publish MGL Zen 0.4.0

on:
  push:
    paths:
      - .github/workflows/publish-mgl-zen-audio.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated audio APK
        run: |
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-ba4c-822f-b619-8e1f9df9a5b5/raw?se=2026-09-17T07%3A31%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=01a0ae3b-48d9-7318-8035-c8cfeeef267c&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A18%3A41Z&ske=2026-09-18T02%3A18%3A41Z&sks=b&skv=2026-02-06&sig=d1W3PwwUj6BMjtunTNUa3Xp7wXz5MUmq91lLElACyA4%3D' -o /tmp/mgl-zen.zip
          unzip -p /tmp/mgl-zen.zip app-debug.apk > MGL-Zen-demo-v0.4.0.apk
          test -s MGL-Zen-demo-v0.4.0.apk
      - name: Publish audio demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MGL-Zen-demo-v0.4.0.apk
          git commit -m "Publish MGL Zen 0.4.0 with offline audio"
          git push
